<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>QR 녹화 · 해독</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-corner="top">
<main class="app">
  <nav class="nav"><a href="index.html">실시간 해독</a><a href="record.html" aria-current="page">녹화 → 해독</a></nav>

  <section class="stage" id="stage">
    <button class="preview" id="preview" type="button" aria-label="미리보기 (탭하면 크게/작게)">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </button>
    <div class="now">
      <div class="phase" id="phase" data-phase="idle">대기</div>
      <p class="message" id="message"></p>
      <p class="hint" id="timeInfo"></p>
    </div>
  </section>

  <section class="card" id="progressCard">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div>
    <div class="pct"><strong id="pct">0%</strong><span id="blocks">—</span></div>
    <dl class="stats">
      <div><dt>새 프레임</dt><dd id="sNew">0</dd></div>
      <div><dt>중복</dt><dd id="sDup">0</dd></div>
      <div><dt>오류</dt><dd id="sBad">0</dd></div>
      <div><dt>다른 전송</dt><dd id="sOther">0</dd></div>
    </dl>
  </section>

  <section class="card result" id="result" hidden>
    <div><strong id="fileName">qr-transfer.zip</strong> <span id="fileSize"></span></div>
    <button class="primary" id="download" type="button">내려받기</button>
  </section>

  <div class="zoombar" id="zoombar" role="group" aria-label="카메라 배율">
    <span>배율</span>
    <button type="button" data-zoom="1" aria-pressed="true">1×</button>
    <button type="button" data-zoom="1.5" aria-pressed="false">1.5×</button>
    <button type="button" data-zoom="2" aria-pressed="false">2×</button>
  </div>

  <div class="actions">
    <button id="cam" type="button">카메라 켜기</button>
    <button class="rec" id="rec" type="button">● 녹화 시작</button>
  </div>
  <div class="actions">
    <button id="save" type="button" disabled>영상 저장</button>
    <button id="pick" type="button">파일 선택</button>
    <input type="file" id="file" accept="video/*" hidden>
  </div>
  <div class="actions">
    <button class="primary" id="decode" type="button" disabled>해독 시작</button>
    <button id="reset" type="button">초기화</button>
  </div>

  <details class="card settings" id="settings">
    <summary>설정</summary>
    <label>카메라
      <select id="facing"><option value="environment">후면</option><option value="user">전면</option></select>
    </label>
    <label>녹화 해상도
      <select id="width"><option value="1280">보통 (1280)</option><option value="1920" selected>높음 (1920)</option></select>
    </label>
    <label>녹화 화질
      <select id="bitrate"><option value="4000000">보통 (4 Mbps)</option><option value="8000000" selected>좋음 (8 Mbps)</option><option value="16000000">최고 (16 Mbps)</option></select>
    </label>
    <label>해독 재생 속도
      <select id="rate"><option value="0.25">0.25배 (가장 꼼꼼)</option><option value="0.5" selected>0.5배</option><option value="1">1배 (빠름)</option></select>
    </label>
    <label>인식 확대 (작은 QR 용)
      <select id="upscale"><option value="1" selected>1배</option><option value="1.5">1.5배</option><option value="2">2배</option></select>
    </label>
    <label>미리보기 위치
      <select id="corner"><option value="top">왼쪽 위</option><option value="bottom">왼쪽 아래</option></select>
    </label>
    <label id="zoomRow" hidden>줌 <input type="range" id="zoom"></label>
    <label id="torchRow" hidden class="inline"><input type="checkbox" id="torch"> 플래시</label>
  </details>
  <p class="hint">녹화하는 동안에는 해독하지 않아서 프레임을 놓치지 않습니다. 녹화한 영상은 폰에만 저장되고, 해독은 이 폰 안에서 느리게 재생하며 진행합니다.</p>
</main>
<script type="module" src="src/record-app.js"></script>
</body>
</html>
